name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, transcripts, or private architecture artifacts.
  - type: input
    id: version
    attributes:
      label: Agentstandards version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: speckit
    attributes:
      label: Spec Kit version
      placeholder: 1.0.10
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized commands and configuration only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostic output
      render: shell
