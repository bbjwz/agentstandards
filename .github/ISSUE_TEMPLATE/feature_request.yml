name: Feature request
description: Propose a focused product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or governance problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without including sensitive project artifacts.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this affect a trust boundary or task gate?
      options:
        - No
        - Yes
        - Unsure
    validations:
      required: true
