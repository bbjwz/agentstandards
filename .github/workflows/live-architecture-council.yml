name: Live architecture council

on:
  workflow_dispatch:
    inputs:
      feature_directory:
        description: "Repository-relative Spec Kit feature directory"
        required: true
        type: string
      codex_model:
        description: "Exact Codex model ID"
        required: true
        type: string
      anthropic_model:
        description: "Exact Anthropic model ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  council:
    runs-on: ubuntu-latest
    environment: live-architecture-council
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SPECIFY_FEATURE_DIRECTORY: ${{ inputs.feature_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.156.1
      - name: Verify explicit manual credentials
        run: test -n "$OPENAI_API_KEY" && test -n "$ANTHROPIC_API_KEY"
      - name: Configure pinned required participants
        run: >-
          uv run --script scripts/python/agentstandards.py init
          --codex-model "${{ inputs.codex_model }}"
          --anthropic-model "${{ inputs.anthropic_model }}"
      - name: Run through the human decision gate
        run: uv run --script scripts/python/agentstandards.py architect --json
      - name: Upload architecture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-council-${{ github.run_id }}
          path: ${{ inputs.feature_directory }}/architecture
          if-no-files-found: error
