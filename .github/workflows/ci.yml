name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - name: Install locked test dependencies
        run: uv sync --extra test --locked
      - name: Lint
        run: uv run --extra test ruff check .
      - name: Test without provider calls
        run: uv run --extra test pytest --cov=agentstandards --cov-report=term-missing

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Validate release metadata
        run: python3 scripts/check_release_metadata.py
      - name: Build Python and Spec Kit distributions
        run: |
          uv build
          uv run python scripts/build_release.py --output dist/spec-kit
      - name: Verify source distribution excludes repository-only files
        run: >-
          python3 -c 'import pathlib, tarfile;
          archive=next(pathlib.Path("dist").glob("*.tar.gz"));
          names=tarfile.open(archive).getnames();
          blocked=("/.github/", "/tests/", "/catalogs/", "/scripts/");
          assert not any(any(part in name for part in blocked) for name in names), names'

  spec-kit-install:
    name: Spec Kit ${{ matrix.spec-kit-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec-kit-version: ["1.0.8", "1.0.10"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - name: Install into a clean Spec Kit Codex project
        env:
          SPEC_KIT_VERSION: ${{ matrix.spec-kit-version }}
        run: bash scripts/verify_spec_kit_install.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
