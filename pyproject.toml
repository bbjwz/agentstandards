[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentstandards"
version = "0.1.0"
description = "Multi-vendor architecture council for GitHub Spec Kit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "bbjwz" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
agentstandards = "agentstandards.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/agentstandards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
pythonpath = ["runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S105", "S106", "S108"]
