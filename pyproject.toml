[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentstandards"
version = "0.1.0"
description = "Multi-vendor architecture council for GitHub Spec Kit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "bbjwz" }]
maintainers = [{ name = "bbjwz" }]
keywords = [
  "ai-agents",
  "architecture",
  "codex",
  "multi-agent",
  "spec-kit",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.urls]
Documentation = "https://github.com/bbjwz/agentstandards#readme"
Issues = "https://github.com/bbjwz/agentstandards/issues"
Repository = "https://github.com/bbjwz/agentstandards"

[project.scripts]
agentstandards = "agentstandards.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["runtime/agentstandards"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/runtime/agentstandards",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
pythonpath = ["runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S105", "S106", "S108"]
